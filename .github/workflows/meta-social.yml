name: Update Meta posts
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: meta-social
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read posts from Meta
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_API_VERSION: 'v26.0'
          META_PAGE_ID: '1352312717963818'
          META_INSTAGRAM_ID: '17841427409612539'
        run: |
          python - <<'PYTHON'
          """Read public posts from the committee's authorized Meta accounts.

          Credentials are supplied by the runner, never written into the public output.
          An incomplete or failed response leaves the existing feed untouched.
          """
          import json
          import os
          import sys
          from html import escape
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode, urlparse


          def get_posts(account, fields, edge, token, version):
              query = urlencode({"fields": fields, "limit": "6"})
              url = f"https://graph.facebook.com/{version}/{account}/{edge}?{query}"
              request = Request(url, headers={"Authorization": f"Bearer {token}"})
              with urlopen(request, timeout=30) as response:
                  body = json.load(response)
              if not isinstance(body.get("data"), list):
                  raise ValueError("Invalid feed response")
              return body["data"]


          def safe_link(value, network):
              host = urlparse(value or "").hostname or ""
              allowed = "facebook.com" if network == "facebook" else "instagram.com"
              if urlparse(value or "").scheme != "https" or not (
                  host == allowed or host.endswith("." + allowed)
              ):
                  raise ValueError("Invalid post link")
              return value


          def collect(token, version, page_id, instagram_id):
              facebook = get_posts(
                  page_id, "id,message,created_time,permalink_url",
                  "published_posts", token, version
              )
              instagram = get_posts(
                  instagram_id, "id,caption,timestamp,permalink,media_type",
                  "media", token, version
              )
              posts = []
              for network, rows in (("facebook", facebook), ("instagram", instagram)):
                  for row in rows:
                      posts.append({
                          "network": network,
                          "id": str(row["id"]),
                          "text": row.get("message", row.get("caption", "")),
                          "published_at": row.get("created_time", row.get("timestamp")),
                          "url": safe_link(row.get("permalink_url", row.get("permalink")), network),
                      })
              return {
                  "updated_at": datetime.now(timezone.utc).isoformat(),
                  "posts": sorted(posts, key=lambda p: p["published_at"], reverse=True),
              }


          def render_windows(feed):
              latest = {}
              for post in sorted(feed["posts"], key=lambda p: p["published_at"], reverse=True):
                  latest.setdefault(post["network"], post)
              # Never erase a working embed when either network returns an empty response.
              if not all(network in latest for network in ("facebook", "instagram")):
                  raise ValueError("Missing network posts")
              fb = safe_link(latest["facebook"]["url"], "facebook")
              ig = escape(safe_link(latest["instagram"]["url"], "instagram"), quote=True)
              plugin = "video.php" if "/reel/" in fb or "/videos/" in fb else "post.php"
              fb_embed = escape("https://www.facebook.com/plugins/" + plugin + "?" +
                                urlencode({"href": fb, "width": "500", "show_text": "true"}), quote=True)
              return f'''<!-- META POSTS START -->
          <div id="ultimi-post-social" style="margin-top:28px">
          <div class="social-feed-grid">
          <div class="social-window">
          <div class="social-window-head"><strong>Facebook</strong><a href="https://www.facebook.com/61594666865834" rel="noopener" target="_blank">Apri pagina ↗</a></div>
          <iframe src="{fb_embed}" width="500" height="720" style="border:0;width:100%;max-width:500px;display:block;margin:auto" scrolling="yes" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" title="Ultimo post Facebook del Comitato Il Riccio" loading="lazy"></iframe>
          <p class="social-note"><a href="{escape(fb, quote=True)}" target="_blank" rel="noopener">Apri questo post su Facebook ↗</a></p>
          </div>
          <div class="social-window">
          <div class="social-window-head"><strong>Instagram</strong><a href="https://www.instagram.com/ilricciorovigo/" rel="noopener" target="_blank">Segui @ilricciorovigo ↗</a></div>
          <blockquote class="instagram-media" data-instgrm-captioned data-instgrm-permalink="{ig}" data-instgrm-version="14" style="background:#fff;border:0;border-radius:12px;margin:0;max-width:540px;min-width:0;width:100%"><a href="{ig}" rel="noopener" target="_blank">Guarda l’ultimo post su Instagram ↗</a></blockquote>
          <p class="social-note"><a href="{ig}" target="_blank" rel="noopener">Apri questo post su Instagram ↗</a></p>
          </div>
          <div class="social-window tiktok-window">
          <div class="social-window-head"><strong>TikTok</strong><a href="https://www.tiktok.com/@ilricciorovigo" rel="noopener" target="_blank">Segui @ilricciorovigo ↗</a></div>
          <blockquote cite="https://www.tiktok.com/@ilricciorovigo" class="tiktok-embed" data-embed-type="creator" data-unique-id="ilricciorovigo" style="max-width:780px;min-width:0"><section><a href="https://www.tiktok.com/@ilricciorovigo?refer=creator_embed" target="_blank" rel="noopener">@ilricciorovigo</a></section></blockquote>
          </div>
          </div>
          <p class="social-note">Foto, video e aggiornamenti dai nostri canali. Se una finestra non si carica, puoi aprire il contenuto direttamente sul social.</p>
          </div>
          <script async src="https://www.instagram.com/embed.js"></script>
          <script async src="https://www.tiktok.com/embed.js"></script>
          <!-- META POSTS END -->'''


          def main():
              try:
                  feed = collect(
                      os.environ["META_PAGE_TOKEN"], os.environ["META_API_VERSION"],
                      os.environ["META_PAGE_ID"], os.environ["META_INSTAGRAM_ID"],
                  )
                  index = Path("index.html")
                  original = index.read_text()
                  start, end = "<!-- META POSTS START -->", "<!-- META POSTS END -->"
                  section = render_windows(feed)
                  if start in original and end in original:
                      before, rest = original.split(start, 1)
                      _, after = rest.split(end, 1)
                      rendered = before + section + after
                  else:
                      anchor = '<p class="social-note">Qui trovi una selezione degli aggiornamenti del Comitato. Per tutti i nuovi contenuti, visita i nostri profili social.</p>'
                      if original.count(anchor) != 1:
                          raise ValueError("Social section not found; no changes written")
                      rendered = original.replace(anchor, section)
                  destination = Path("social-posts.json")
                  temporary = destination.with_suffix(".tmp")
                  temporary.write_text(json.dumps(feed, ensure_ascii=False, indent=2) + "\n")
                  temporary.replace(destination)
                  index.write_text(rendered)
                  print(f"Updated {len(feed['posts'])} posts.")
              except Exception:
                  # Do not log API responses, request URLs, headers or token values.
                  print("Meta synchronization failed; existing feed preserved.", file=sys.stderr)
                  return 1
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYTHON
      - name: Save updated public feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-posts.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update public Meta posts"
            git push
          fi
      - name: Prepare public site only
        run: |
          mkdir -p _site
          cp index.html social-posts.json _site/
          find . -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.css' -o -name '*.js' \) -exec cp {} _site/ \;
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
